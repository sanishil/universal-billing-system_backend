# ============================================================
#   Universal Billing System — Application Configuration
#   Spring Boot 3.3.0 | Java 21 | PostgreSQL
# ============================================================

# ── Application ───────────────────────────────────────────
spring.application.name=universal-billing-system
# server.address removed so the backend listens on all interfaces (localhost + LAN IP)
server.port=8080

# ── PostgreSQL Database ───────────────────────────────────
#   Create a database named "universal_billing" in pgAdmin
#   before starting the app.
#
#   Steps:
#   1. Open pgAdmin or psql
#   2. Run: CREATE DATABASE universal_billing;
#   3. Fill in your PostgreSQL username and password below
# ---------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/universal_billing
spring.datasource.username=postgres
spring.datasource.password=Sani@2003
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────
#   ddl-auto=update  → Hibernate will AUTO-CREATE tables on first run
#                      and update them when entity classes change.
#   show-sql=true    → Prints SQL queries in the console (helpful for learning)
# ---------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.data.web.pageable.serialization-mode=via-dto

# ── JWT (JSON Web Token) ──────────────────────────────────
#   jwt.secret   → A long random secret key to sign tokens.
#                  CHANGE THIS in production to a real random 256-bit string.
#   jwt.expiration → Token lifetime in milliseconds
#                    86400000 ms = 24 hours
# ---------------------------------------------------------
jwt.secret=ubs-super-secret-key-change-this-in-production-min-256-bits-long
jwt.expiration=86400000

# ── CORS (Cross-Origin Resource Sharing) ─────────────────
#   Allow your Angular frontend (running on port 4200) to
#   call this backend (running on port 8080).
# ---------------------------------------------------------
cors.allowed-origins=http://localhost:4200

# ── Email (SMTP) ──────────────────────────────────────────
#   Used to send: password reset emails, payment notifications.
#   Using Gmail example below.
#
#   For Gmail:
#   1. Enable "2-Step Verification" in your Google account
#   2. Go to: Google Account → Security → App Passwords
#   3. Generate a password and put it in src/main/resources/secrets.properties
#      (git-ignored) or in the MAIL_USERNAME / MAIL_PASSWORD env vars.
#      NEVER commit the real password to this file.
# ---------------------------------------------------------
spring.config.import=optional:classpath:secrets.properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true



# ── Business Constants ────────────────────────────────────
#   These match the constants from the frontend specification.
# ---------------------------------------------------------
app.supplier.gstin=29AABCU9603R1ZM
app.supplier.state-code=29
# Allowed CORS origins (comma-separated)
app.base-url=http://localhost:4200,http://192.168.1.106:4200,http://192.168.1.106
# Single frontend URL used to build public share links (/bill/view/<token>)
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:4200}

# ── Logging ───────────────────────────────────────────────
#   INFO level shows startup messages and general info.
#   Set to DEBUG to see very detailed logs.
# ---------------------------------------------------------
logging.level.com.billing=DEBUG
logging.level.org.springframework.security=INFO

